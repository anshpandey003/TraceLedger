[project]
name = "traceledger-backend"
version = "0.1.0"
description = "Evidence verification and investigation backend for TraceLedger"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.141,<0.142",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "gemini: tests that call the real Gemini API",
]