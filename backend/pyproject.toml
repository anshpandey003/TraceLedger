description = "Evidence verification and investigation backend for TraceLedger"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.141,<0.142",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"